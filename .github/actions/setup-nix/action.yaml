name: 'Setup Nix'
description: 'Install Nix and configure Cachix'
inputs:
  cachix-auth-token:
    description: 'Cachix authentication token'
    required: false
runs:
  using: 'composite'
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
      with:
        github_access_token: ${{ github.token }}
        extra_nix_config: |
          max-jobs = auto
          # Without this the nixConfig in flake.nix is dropped as untrusted, so
          # cache.numtide.com never applies and llm-agents builds from source.
          accept-flake-config = true

    - name: Setup Cachix (11gather11)
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: 11gather11
        authToken: ${{ inputs.cachix-auth-token }}

    - name: Cache Nix store
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
        gc-max-store-size-linux: 4G
