name: 'Bot: Auto-rebase PRs'

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: auto-rebase
  # Debounce, unlike the other workflows here. A burst of commits to main only
  # needs one rebase — the last one — and each run force-pushes every stale
  # branch and starts a full CI run on each of their PRs. Cancelling is safe
  # because the loop handles one PR at a time and pushes it before moving on, so
  # an interrupted run leaves finished branches finished and the next run picks
  # up whatever is still behind.
  cancel-in-progress: true

# Every write goes through the bot's app token; GITHUB_TOKEN only reads.
permissions:
  contents: read

jobs:
  rebase-prs:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository (for local actions)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up git bot identity
        id: bot
        uses: ./.github/actions/setup-git-bot
        with:
          app-id: ${{ secrets.NIX_UPDATER_APP_ID }}
          private-key: ${{ secrets.NIX_UPDATER_APP_PRIVATE_KEY }}

      - name: Checkout repository (with bot token)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.bot.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Rebase open flake update PRs
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          set -euo pipefail

          echo "=== Finding open flake update PRs ==="

          # Get all open PRs with update-flake- branches
          prs=$(gh pr list --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("update-flake-")) | "\(.number) \(.headRefName)"')

          if [ -z "$prs" ]; then
            echo "No open flake update PRs found"
            exit 0
          fi

          echo "Found PRs to rebase:"
          echo "$prs"

          # Process each PR
          echo "$prs" | while read -r pr_number branch_name; do
            echo ""
            echo "=== Processing PR #$pr_number (branch: $branch_name) ==="

            # Fetch the branch
            git fetch origin "$branch_name"

            # Check if branch is behind main
            behind_count=$(git rev-list --count "origin/$branch_name..origin/main")

            if [ "$behind_count" -eq 0 ]; then
              echo "Branch is up to date, skipping"
              continue
            fi

            echo "Branch is $behind_count commits behind main, rebasing..."

            # Checkout and rebase
            git checkout -B "$branch_name" "origin/$branch_name"

            if git rebase origin/main; then
              echo "Rebase successful, force pushing..."
              # checkout keeps no credentials; gh hands git this step's GH_TOKEN.
              git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push --force origin "$branch_name"
              echo "PR #$pr_number rebased successfully"
            else
              echo "Rebase failed for PR #$pr_number, aborting"
              git rebase --abort
            fi

            # Return to main
            git checkout main
          done

          echo ""
          echo "=== Rebase complete ==="
