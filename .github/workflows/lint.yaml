name: 'CI: Lint'

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseding a pull request's run is the point of this; superseding main's
  # discards the only result that commit will ever have.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every write goes through the bot's app token; GITHUB_TOKEN only reads.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check flake
        run: nix flake check --all-systems --show-trace

      - name: Check formatting
        run: nix run .#fmt -- --fail-on-change
