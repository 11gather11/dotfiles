name: 'CI: Nix build'

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseding a pull request's run is the point of this; superseding main's is
  # not. A cancelled run leaves main with no build result for that commit, which
  # is how 32129221997 ended up neither green nor red.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Check if Nix-related files changed
  changes:
    runs-on: ubuntu-24.04-arm
    outputs:
      nix: ${{ steps.decide.outputs.nix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            nix:
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/**'
              - '.github/workflows/nix-build.yaml'
              - '.github/actions/setup-nix/**'

      # The build steps below are skipped by a step-level `if:`, so a skipped
      # job still reports success — that is deliberate, because these are
      # required checks and a job-level skip would block docs-only pull
      # requests. The cost is that a skip is indistinguishable from a build.
      #
      # On a pull request that is a fair trade. On main it is not: after the
      # Linux build broke, three documentation commits skipped it and reported
      # success, so main looked green for an hour while both Linux
      # configurations failed to evaluate. Build main unconditionally, and keep
      # the filter for pull requests.
      - id: decide
        env:
          FILTERED: ${{ steps.filter.outputs.nix }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "nix=$FILTERED" >> "$GITHUB_OUTPUT"
          else
            echo "nix=true" >> "$GITHUB_OUTPUT"
          fi

  build-ubuntu:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip if no Nix changes
        if: needs.changes.outputs.nix != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "No Nix-related changes detected, skipping build"

      - name: Checkout repository
        if: needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Nix
        if: needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build Linux (Home Manager) configuration
        if: needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          nix build .#homeConfigurations.11gather11.activationPackage \
            --print-build-logs \
            --show-trace

  build-ubuntu-arm:
    needs: changes
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Skip if no Nix changes
        if: needs.changes.outputs.nix != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "No Nix-related changes detected, skipping build"

      - name: Checkout repository
        if: needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Nix
        if: needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build Linux (Home Manager) configuration for aarch64
        if: needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          nix build .#homeConfigurations.11gather11-aarch64.activationPackage \
            --print-build-logs \
            --show-trace

  build-darwin:
    needs: changes
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Skip if no Nix changes
        if: needs.changes.outputs.nix != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "No Nix-related changes detected, skipping build"

      - name: Checkout repository
        if: needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Nix
        if: needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build macOS (nix-darwin + Home Manager) configuration
        if: needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          nix build .#darwinConfigurations.11gather11.system \
            --print-build-logs \
            --show-trace
