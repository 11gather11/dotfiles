name: Nix Diff Check

on:
  pull_request:
    paths:
      - 'flake.lock'
      - 'flake.nix'
      - 'nix/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  nix-diff:
    name: nix-diff (${{ matrix.system }})
    # One runner per architecture, rather than both diffs on one. Computing a
    # diff means realising both sides, and a derivation for a foreign system
    # can only be substituted, never built: the moment a nixpkgs bump empties
    # the cache, diffing x86_64-linux on an arm runner stops with `platform
    # mismatch`. That is exactly the pull request whose diff is worth reading.
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Run nix-diff
        uses: natsukium/nix-diff-action@727d00a6c5e0808d1f7990012f591399e39b0eed # main
        with:
          skip-no-change: true
          attributes: |
            - displayName: home-manager (${{ matrix.system }})
              attribute: diffTargets.home-${{ matrix.system }}
