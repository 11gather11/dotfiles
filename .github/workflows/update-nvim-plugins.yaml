name: 'Bot: Update Neovim plugins'

on:
  schedule:
    # Weekly, an hour after the herdr plugin pins. These follow other people's
    # plugins rather than this machine's own inputs, so a daily run would
    # mostly open nothing.
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository (for local actions)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up git bot identity
        id: bot
        uses: ./.github/actions/setup-git-bot
        with:
          app-id: ${{ secrets.NIX_UPDATER_APP_ID }}
          private-key: ${{ secrets.NIX_UPDATER_APP_PRIVATE_KEY }}

      - name: Checkout repository (with bot token)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.bot.outputs.token }}

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: hustcer/setup-nu@9215c80adb545a85c419d5085b76eb6d082f49e7 # v3.27
        with:
          version: '0.115.1'

      - name: Update the plugins
        id: update
        shell: nu {0}
        env:
          DOTFILES_DIR: ${{ github.workspace }}
        run: |
          const LOCK = 'nvim/lazy-lock.json'

          # Lazy.nvim installs every plugin before it can update one, so this
          # is a clone of the whole plugin set rather than a lock file edit.
          nix run .#nvim-update

          # `git diff --quiet` exits 1 when the path differs, which Nushell
          # raises as a command failure, so the exit code has to be inspected.
          let updated = (git diff --quiet -- $LOCK | complete | get exit_code) != 0
          if not $updated {
            print 'Every plugin is already at its newest revision.'
            "has_changes=false\n" | save --append $env.GITHUB_OUTPUT
            exit 0
          }

          # The lock is one line per plugin, so the diff names exactly what
          # moved. `+` and `-` lines pair up; the added ones carry the new revs.
          let moved = (
            git diff -U0 -- $LOCK
            | lines
            | where { |l| ($l | str starts-with '+') and not ($l | str starts-with '+++') }
            | each { |l| $l | parse -r '"(?<name>[^"]+)"' | get -o 0.name }
            | compact
            | uniq
          )

          print $"Updated: ($moved | str join ', ')"
          git add $LOCK
          $"has_changes=true\nmoved=($moved | to json --raw)\n" | save --append $env.GITHUB_OUTPUT

      - name: Restore from the new lock
        if: steps.update.outputs.has_changes == 'true'
        # The update leaves the plugins where it put them, which says nothing
        # about whether the lock it wrote can be checked out from scratch. This
        # is the same command the activation runs on this machine.
        env:
          DOTFILES_DIR: ${{ github.workspace }}
        run: nix run .#nvim-restore

      - name: Create the pull request
        id: pr
        if: steps.update.outputs.has_changes == 'true'
        shell: nu {0}
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          MOVED: ${{ steps.update.outputs.moved }}
        run: |
          const BRANCH = 'bot/update-nvim-plugins'

          let moved = ($env.MOVED | from json)

          let title = match ($moved | length) {
            1 => $"chore\(nvim): update ($moved.0)"
            $n => $"chore\(nvim): update ($n) plugins"
          }

          let body = [
            'Automated `Lazy! update`, with the resulting `lazy-lock.json`.'
            ''
            '## Updated'
            ''
            ...($moved | each { |p| $"- `($p)`" })
            ''
            'Restored from the new lock in the same run. Auto-merges once the required checks pass.'
          ]
          | str join "\n"

          git checkout -b $BRANCH
          git commit -m $title
          # A re-run reuses the branch name, so the push is forced.
          git push --force origin $BRANCH

          match (gh pr list --head $BRANCH --json number | from json | get -o 0.number) {
            null => {
              print $"Creating a pull request for ($BRANCH)"
              gh pr create --title $title --body $body --base main --head $BRANCH
            }
            $existing => {
              print $"Updating existing PR #($existing)"
              gh pr edit $existing --title $title --body $body
            }
          }

          let number = (gh pr view $BRANCH --json number | from json | get number)
          $"pr_number=($number)\n" | save --append $env.GITHUB_OUTPUT

          let url = (gh pr view $BRANCH --json url | from json | get url)
          [
            '## Neovim plugins'
            ''
            ...($moved | each { |p| $"- `($p)`" })
            ''
            $"PR: ($url)"
            ''
          ]
          | str join "\n"
          | save --append $env.GITHUB_STEP_SUMMARY

      - name: Enable auto-merge
        if: steps.update.outputs.has_changes == 'true'
        uses: ./.github/actions/auto-merge-pr
        with:
          pr-number: ${{ steps.pr.outputs.pr_number }}
          github-token: ${{ steps.bot.outputs.token }}
