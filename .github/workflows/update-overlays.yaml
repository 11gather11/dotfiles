name: 'Bot: Update herdr plugin packages'

on:
  schedule:
    # Weekly. These follow other people's plugins rather than this machine's
    # own inputs, so a daily run would mostly open nothing.
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository (for local actions)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up git bot identity
        id: bot
        uses: ./.github/actions/setup-git-bot
        with:
          app-id: ${{ secrets.NIX_UPDATER_APP_ID }}
          private-key: ${{ secrets.NIX_UPDATER_APP_PRIVATE_KEY }}

      - name: Checkout repository (with bot token)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.bot.outputs.token }}

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: hustcer/setup-nu@9215c80adb545a85c419d5085b76eb6d082f49e7 # v3.27
        with:
          version: '0.115.1'

      - name: Run nix-update on the plugin packages
        id: update
        shell: nu {0}
        run: |
          # Both directories hold a pin nix-update can move: the overlay defines
          # the plugins that are only a source tree, nix/packages the ones that
          # are built.
          const PINNED = ['nix/overlays' 'nix/packages']
          # Plugins that publish releases, so the pin follows the newest tag.
          const TAGGED = [herdr-automatic-rename herdr-pluck]
          # Plugins with no tags at all; the pin follows the default branch.
          const BRANCH = [herdr-window-title-sync herdr-which-key]

          # `git diff --quiet` exits 1 when the path differs, which Nushell raises
          # as a command failure, so the exit code has to be inspected instead.
          def has-changes [--cached]: nothing -> bool {
            let scope = if $cached { ['--cached'] } else { [] }
            (git diff ...$scope --quiet -- ...$PINNED | complete | get exit_code) != 0
          }

          # nix-update exits non-zero when upstream has nothing newer, which is the
          # ordinary outcome rather than a reason to fail the run.
          def update-package [package: string, extra: list<string>]: nothing -> bool {
            print $"::group::nix-update ($package)"
            try { nix run nixpkgs#nix-update -- --flake ...$extra $package } catch {
              print $"::warning::nix-update failed for ($package)"
            }
            print '::endgroup::'

            let updated = (has-changes)
            nix run .#fmt -- ...$PINNED
            # Stage as we go, so the next package is compared against a clean tree.
            git add ...$PINNED
            $updated
          }

          let targets = [
            ...($TAGGED | each { |p| { name: $p, extra: [] } })
            ...($BRANCH | each { |p| { name: $p, extra: ['--version=branch'] } })
          ]

          let moved = (
            $targets
            | each { |t| { name: $t.name, updated: (update-package $t.name $t.extra) } }
            | where updated
            | get name
          )

          if not (has-changes --cached) {
            print 'Every plugin is already at its latest revision.'
            "has_changes=false\n" | save --append $env.GITHUB_OUTPUT
            exit 0
          }

          print $"Updated: ($moved | str join ', ')"
          $"has_changes=true\nmoved=($moved | to json --raw)\n" | save --append $env.GITHUB_OUTPUT

      - name: Build the configuration
        if: steps.update.outputs.has_changes == 'true'
        run: nix build .#darwinConfigurations.11gather11.system --accept-flake-config

      - name: Create the pull request
        id: pr
        if: steps.update.outputs.has_changes == 'true'
        shell: nu {0}
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          MOVED: ${{ steps.update.outputs.moved }}
        run: |
          const BRANCH = 'bot/update-overlays'

          let moved = ($env.MOVED | from json)

          let title = match ($moved | length) {
            1 => $"chore\(herdr): update ($moved.0)"
            $n => $"chore\(herdr): update ($n) plugin packages"
          }

          let body = [
            'Automated refresh of the herdr plugin pins via `nix-update`.'
            ''
            '## Updated'
            ''
            ...($moved | each { |p| $"- `($p)`" })
            ''
            'Auto-merges once the required checks pass.'
          ]
          | str join "\n"

          git checkout -b $BRANCH
          git commit -m $title
          # A re-run reuses the branch name, so the push is forced.
          git push --force origin $BRANCH

          match (gh pr list --head $BRANCH --json number | from json | get -o 0.number) {
            null => {
              print $"Creating a pull request for ($BRANCH)"
              gh pr create --title $title --body $body --base main --head $BRANCH
            }
            $existing => {
              print $"Updating existing PR #($existing)"
              gh pr edit $existing --title $title --body $body
            }
          }

          let number = (gh pr view $BRANCH --json number | from json | get number)
          $"pr_number=($number)\n" | save --append $env.GITHUB_OUTPUT

          let url = (gh pr view $BRANCH --json url | from json | get url)
          [
            '## herdr plugin pins'
            ''
            ...($moved | each { |p| $"- `($p)`" })
            ''
            $"PR: ($url)"
            ''
          ]
          | str join "\n"
          | save --append $env.GITHUB_STEP_SUMMARY

      - name: Enable auto-merge
        if: steps.update.outputs.has_changes == 'true'
        uses: ./.github/actions/auto-merge-pr
        with:
          pr-number: ${{ steps.pr.outputs.pr_number }}
          github-token: ${{ steps.bot.outputs.token }}
