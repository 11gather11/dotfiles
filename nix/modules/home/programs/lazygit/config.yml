# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json

gui:
  nerdFontsVersion: '3'
  skipRewordInEditorWarning: true
git:
  # Every field is a fixed width and the subject is truncated, because a
  # commit that wraps onto a second line breaks the graph's rails in half and
  # the shape of the history is the only reason to be in this view. Press
  # enter on a commit to read the message it cut off.
  allBranchesLogCmds:
    - 'git log --graph --all --date=relative --pretty=format:"%C(auto)%h %C(dim white)%<(13,trunc)%cd%C(reset) %C(blue)%<(11,trunc)%cn%C(reset)%<(46,trunc)%s%C(auto)%d"'
  branchLogCmd: 'git log --graph --date=relative --pretty=format:"%C(auto)%h %C(dim white)%<(13,trunc)%cd%C(reset) %C(blue)%<(11,trunc)%cn%C(reset)%<(46,trunc)%s%C(auto)%d" {{branchName}} --'
  # lazygit fetches every sixty seconds, in every open instance, whether or
  # not anyone is looking at it. Four of the repositories here have an ssh
  # remote, and each of those fetches asks 1Password to authorise the key — so
  # a pane left open in the background interrupts whatever is happening in the
  # foreground, for a repository nobody is touching.
  #
  # `f` fetches when a fetch is actually wanted. The commit-signing prompt is
  # separate and stays: that one is asked once per commit, by the person making
  # it.
  autoFetch: false

  overrideGpg: true
  diffRenderers:
    - colorArg: always
      command: delta --color-only --paging=never
customCommands:
  - key: I
    context: localBranches
    description: gh poi
    command: gh poi
